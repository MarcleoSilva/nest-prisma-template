services:
  api:
    build: .
    container_name: alcmena-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alcmena?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASS: ""
      MAIL_FROM: no-reply@alcmena.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated

  db:
    image: postgres:16-alpine
    container_name: alcmena
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alcmena
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alcmena"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: alcmena-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: alcmena-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Dev-only. Start with: docker compose --profile tools up -d
  studio:
    build: .
    container_name: alcmena-studio
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alcmena?schema=public
    command: sh -c "pnpm exec prisma studio --port 5555 --hostname 0.0.0.0 --browser none"
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated

volumes:
  pg-data:
  redis-data: